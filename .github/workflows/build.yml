name: build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # needed only to attach the zip to a GitHub Release on tags

jobs:
  kext:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain info
        run: |
          xcodebuild -version
          xcrun clang --version
          xcrun --show-sdk-path

      - name: Fetch dependencies (MacKernelSDK + 10.6 IOAudioFamily headers)
        run: make deps

      - name: Build
        run: make kext

      - name: Static checks (load commands, undefined symbols)
        run: make check

      - name: Package
        run: make zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: QemuHDAAudio-${{ github.sha }}
          path: build/QemuHDAAudio-*.zip
          if-no-files-found: error

      - name: Attach to release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/QemuHDAAudio-*.zip
